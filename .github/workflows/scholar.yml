name: Update Scholar metrics

on:
  schedule:
    - cron: "17 21 * * *"   # daily, 06:17 KST
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Scholar metrics (keeps old data on failure)
        run: python scripts/fetch_scholar.py || echo "fetch failed; keeping previous data"
      - name: Rebuild pre-rendered HTML
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update Google Scholar metrics"
            git push
          fi
